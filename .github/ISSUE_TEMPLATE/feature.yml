name: Feature or change request
description: Propose a capability in the repository that owns it.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Route the work with [CONNECT → RULE → DEPLOY → EQUIP → OPERATE](https://github.com/atbrydeud/.github/blob/main/docs/PROJECT_MAP.md).
        A change to what **must be true** is a Governance change, not an implementation feature.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, missing or repeatedly painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the outcome and the smallest useful change.
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Owning repository
      options:
        - ecosystem-bootstrap — CONNECT
        - ecosystem-governance — RULE
        - ecosystem-blueprints — DEPLOY
        - ecosystem-library — EQUIP
        - ecosystem-operations — OPERATE
        - ecosystem-platform — WEB3 PRODUCT
        - ecosystem-protocols — WEB3 PROTOCOLS
        - Unsure — needs triage
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: Cross-layer inputs and outputs
      description: Which other repositories provide inputs or consume outputs? Separate implementation by owner.
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: People, agents, organizations, data, production or external users affected.
    validations:
      required: true
  - type: checkboxes
    id: implications
    attributes:
      label: Additional work required
      options:
        - label: New provider account, identity or credential reference
        - label: Governance/policy decision
        - label: Infrastructure/runtime deployment change
        - label: Reusable Library capability
        - label: Operations workflow/SOP change
        - label: Platform or Protocols integration
        - label: Baseline/version migration
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I used the project map or marked ownership as unsure
          required: true
        - label: No secrets, credentials or confidential data appear in this request
          required: true

